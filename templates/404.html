{% extends 'base.html' %}

{% block title %}Page Not Found — SmartReco{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 4rem auto; text-align: center;">
    <div style="font-size: 6rem; margin-bottom: 1rem;">🔍</div>
    <h1 style="font-size: 2.5rem; margin-bottom: 1rem; background: linear-gradient(135deg, #6366f1, #38bdf8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
        404 - Page Not Found
    </h1>
    <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">
        The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="/" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 0.5rem;">
        ← Back to Home
    </a>
</div>
{% endblock %}
