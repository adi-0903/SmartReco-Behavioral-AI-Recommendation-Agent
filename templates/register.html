{% extends 'base.html' %}

{% block title %}Sign Up — SmartReco{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.5rem;">
    <h2 style="text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem;">Create Account</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem;">
        Join SmartReco for personalized agentic recommendations
    </p>

    <form method="POST" action="/register">
        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-input" placeholder="Sarah Learner" required>
        </div>

        <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-input" placeholder="sarah@example.com" required>
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <div class="form-group">
            <label class="form-label">Account Role</label>
            <select name="role" class="form-select">
                <option value="user">Regular Learner User</option>
                <option value="admin">Catalog Admin User</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1rem;">
            Create Account →
        </button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
        Already have an account? <a href="/login" style="color: var(--accent);">Sign in here</a>
    </p>
</div>
{% endblock %}
