{% extends 'base.html' %}

{% block title %}Server Error — SmartReco{% endblock %}

{% block content %}
<div class="reveal animate-in" style="max-width: 600px; margin: 6rem auto; text-align: center;">
    <div class="glass-card animated-border" style="border-radius: var(--radius-xl); padding: 4rem 3rem; border: 1px dashed var(--danger);" data-magnetic>
        <div style="font-size: 7rem; margin-bottom: 1.5rem; animation: pulse 1.5s ease-in-out infinite;" aria-hidden="true">⚠️</div>
        <h1 style="font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--danger), var(--warning)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">500 - Server Error</h1>
        <p style="color: var(--text-muted); font-size: 1.2rem; margin-bottom: 2.5rem; line-height: 1.7; max-width: 400px; margin-left: auto; margin-right: auto;">
            Something went wrong on our end. Our team has been automatically notified and is working on a fix.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="/" class="btn btn-primary btn-lg animated-border" data-magnetic>
                <span aria-hidden="true">🏠</span> Back to Home
            </a>
            <button onclick="history.back()" class="btn btn-secondary btn-lg animated-border" data-magnetic>
                <span aria-hidden="true">←</span> Go Back
            </button>
        </div>
    </div>
</div>

<style>
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}
</style>
{% endblock %}
