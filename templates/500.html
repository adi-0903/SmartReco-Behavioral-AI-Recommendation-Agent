{% extends 'base.html' %}

{% block title %}Server Error — SmartReco{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 4rem auto; text-align: center;">
    <div style="font-size: 6rem; margin-bottom: 1rem;">⚠️</div>
    <h1 style="font-size: 2.5rem; margin-bottom: 1rem; background: linear-gradient(135deg, #ef4444, #f59e0b); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
        500 - Server Error
    </h1>
    <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">
        Something went wrong on our end. Our team has been notified.
    </p>
    <a href="/" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 0.5rem; margin-right: 1rem;">
        ← Back to Home
    </a>
    <button onclick="history.back()" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 0.5rem;">
        Go Back
    </button>
</div>
{% endblock %}
