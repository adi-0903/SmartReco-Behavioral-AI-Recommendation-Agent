services:
  - type: web
    name: smartreco-behavioral-ai
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt && python seed_deploy.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --preload
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: MESH_API_KEY
        sync: false
      - key: MESH_BASE_URL
        value: https://api.meshapi.ai/v1
      - key: MESH_MODEL
        value: openai/gpt-4o
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RATELIMIT_STORAGE_URL
        sync: false
      - key: RATELIMIT_DEFAULT
        value: "200 per minute"
      - key: DATABASE_URL
        sync: false
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "60"